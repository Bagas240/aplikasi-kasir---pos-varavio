name: Build & Release Voravio APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          elif [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Prepare Secrets and Keystore
        run: |
          touch .env
          touch .env.example
          touch app/.env
          touch app/.env.example
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK (assembleDebug)
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Prepare APK
        id: find_apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          mkdir -p release_output
          FINAL_APK="release_output/Voravio-POS-v2.0.apk"
          cp "$RAW_APK" "$FINAL_APK"
          echo "APK successfully prepared at: $FINAL_APK"
          echo "apk_path=$FINAL_APK" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voravio-POS-v2.0-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Determine Release Details
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.0" >> $GITHUB_OUTPUT
            echo "title=Voravio POS v2.0 (Latest APK)" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && !cancelled()
        continue-on-error: true
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ### 📱 Voravio POS - Aplikasi Kasir Pintar (APK Siap Pakai)
            - **Versi:** 2.0
            - **Fitur Baru:** LruCache untuk gambar inventaris & data produk, hemat RAM untuk perangkat low-end.
            - **Instalasi:** Unduh file `.apk` di bawah dan install langsung di perangkat Android.
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

